# Mayur Prajapati — personal site (CareerCanvas)
# https://themes.gohugo.io/themes/careercanvas/

baseURL = "https://mayurprajapati.in/"
locale = "en-US"
title = "Mayur Prajapati"
theme = "careercanvas"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    contentDir = "content/en"
    label = "English"
    weight = 1
    [languages.en.params]
      tagline = "Senior Automation Engineer & SDET at Briq. Test Automation · Selenium / Playwright / Appium · CI/CD at scale · AI-Augmented Testing"
      hero_description = "Automation Engineer & SDET at Briq with 7+ years designing test automation frameworks across Web, Desktop, API, PDF and OCR — 350+ production bots, 1,200+ scripts migrated off JUnit, and test execution scaled across 1,200+ Jenkins jobs."
      hero_location = "India"
      resume_url = "/files/Mayur_Prajapati_Resume.pdf"
      collab_tags = [
        "Test automation frameworks",
        "Selenium / Playwright / Appium",
        "API testing with RestAssured",
        "CI/CD & Jenkins at scale",
        "AI-augmented testing"
      ]

[build]
  writeStats = true

[params]
  name = "Mayur Prajapati"
  firstName = "Mayur"
  lastName = "Prajapati"
  email = "mail@mayurprajapati.in"
  profile_image = "/images/profile.jpg"
  author = "Mayur Prajapati"
  og_image = "images/profile.jpg"
  description = "Automation Engineer & SDET — test automation frameworks, Selenium/Playwright/Appium, API testing, CI/CD at scale, and AI-augmented testing."

  linkedin_url = "https://linkedin.com/in/mayurengineer"
  linkedin_text = "linkedin.com/in/mayurengineer"
  github_url = "https://github.com/mayurprajapati"
  github_text = "github.com/mayurprajapati"

  calendly_url = ""
  calendly_height = "700px"
  copyright = "© 2026 | Mayur Prajapati"
  resume_url_en = "/files/Mayur_Prajapati_Resume.pdf"
  resume_label = "View CV"
  sectionPagesMenu = "main"
  formspreeendpoint = ""
  pexelsapikey = "QONO7trG4NAXGP9JrZ8EASfhYbfR9YPNcLlrFVAOpOQeJZihX6IK4WuM"

  [[params.social]]
    icon = "linkedin-in"
    url = "https://linkedin.com/in/mayurengineer"
  [[params.social]]
    icon = "github"
    url = "https://github.com/mayurprajapati"
  [[params.social]]
    icon = "medium"
    url = "https://medium.com/@mayurengineer"

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"

[server]
  [[server.headers]]
    for = "/**/*.css"
    [server.headers.values]
      Content-Type = "text/css"

[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$']

[params.color_palettes]
  [[params.color_palettes.palette]]
    name = "ocean"
    main_color = "#1E40AF"
    second_color = "#06B6D4"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "steel"
    main_color = "#374151"
    second_color = "#6B7280"
    third_color = "#10B981"
  [[params.color_palettes.palette]]
    name = "slate"
    main_color = "#475569"
    second_color = "#0EA5E9"
    third_color = "#F97316"
  [[params.color_palettes.palette]]
    name = "navy"
    main_color = "#1E3A8A"
    second_color = "#3B82F6"
    third_color = "#F59E0B"

[params.pexels]
  queries = ["software engineering", "data center", "city skyline", "sky and clouds"]
